services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: seatbooking
      POSTGRES_USER: seatbooking
      POSTGRES_PASSWORD: seatbooking
    ports:
      - "5432:5432"
    volumes:
      - dbdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U seatbooking"]
      interval: 5s
      timeout: 3s
      retries: 10

  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/seatbooking
      DB_USER: seatbooking
      DB_PASSWORD: seatbooking
    ports:
      - "8080:8080"

volumes:
  dbdata:
