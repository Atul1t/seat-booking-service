# Docker 29 raised the minimum Docker API version it accepts. The docker-java client
# bundled with Testcontainers 1.x still defaults to API 1.32, so the daemon rejects
# every request with HTTP 400 ("client version 1.32 is too old") and Testcontainers
# reports "Could not find a valid Docker environment".
#
# 1.44 sits inside the range Docker 29 accepts (1.40-1.54) and is also supported by
# older engines, so it works locally and in CI.
#
# Delete this file when upgrading to Testcontainers 2.x, which negotiates the API
# version with the daemon instead of hardcoding one.
api.version=1.44
